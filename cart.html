<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteBox Cart</title>
    <link rel="stylesheet" href="cart.css">
    <link  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="icon" type="image/png" href="./images/Gemini_Generated_Image_vpk6nvvpk6nvvpk6-removebg-preview.png">

</head>
<body>
    <header>
        
        <nav>
            <div id="title">
                <!-- <h1>Bite<span style="color: red;">Box</span></h1>         -->
                <a href="index.html">
                <img src="./images/bitebox_white_text.png" alt="logo">
                </a>
            </div>
            <ul>
                <li><a href="./home.html">Home</a></li>
                <li><a href="./menu.html">Menu</a></li>
                <li><a href="./biteDeals.html">Bite Deals</a></li>
                <li><a href="./cart.html"><i class="ri-shopping-cart-2-fill"></i></a></li>
                <li><a href="./login.html"><i class="ri-login-box-line"></i>Login</a></li>
                
            </ul>
        </nav>
    </header>

    <section class="cart">
        <table>
            <thead>
                <th>Item</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Remove</th>
            </thead>

            <tbody>
                <tr>
                    <td class="item">
                        <img src="images/burger.jpg" alt="">
                        <div class="desc">
                            <h4>Burger</h4>
                            <p>Lorem ipsum dolor sit amet.</p>
                        </div>
                    </td>
                    <td>₹150</td>
                    <td>
                        <div class="quantity">
                            <button class="btn"><p>+</p></button>
                            <span>2</span>
                            <button class="btn"><p>-</p></button>
                        </div>
                    </td>
                    <td>₹300</td>
                    <td>
                        <button class="remove"><i class="ri-close-line"></i></button>
                    </td>
                </tr>

                <tr>
                    <td class="item">
                        <img src="images/pizza.avif" alt="">
                        <div class="desc">
                            <h4>Pizza</h4>
                            <p>Lorem ipsum dolor sit amet.</p>
                        </div>
                    </td>
                    <td>₹250</td>
                    <td>
                        <div class="quantity">
                            <button class="btn">+</button>
                            <span>2</span>
                            <button class="btn">-</button>
                        </div>
                    </td>
                    <td>₹500</td>
                    <td>
                        <button class="remove"><i class="ri-close-line"></i></button>
                    </td>
                </tr>

                <tr>
                    <td class="item">
                        <img src="images/pasta.jpg" alt="">
                        <div class="desc">
                            <h4>Pasta</h4>
                            <p>Lorem ipsum dolor sit amet.</p>
                        </div>
                    </td>
                    <td>₹300</td>
                    <td>
                        <div class="quantity">
                            <button class="btn"><p >+</p></button>
                            <span>2</span>
                            <button class="btn"><p>-</p></button>
                        </div>
                    </td>
                    <td>₹600</td>
                    <td>
                        <button class="remove"><i class="ri-close-line"></i></button>
                    </td>
                </tr>

                <tr class="grand-total">
                    <td colspan="3"><b>Grand Total </b></td>
                    <td><b>₹1400</b></td>
                    <td><button>Proced</button></td>

                </tr>
            </tbody>

        </table>
    </section>


</body>
</html>
